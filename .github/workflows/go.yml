name: Go

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  Test:
    strategy:
      matrix:
        go-version: [1.25.x, 1.26.x, 1.27.x]
        os: [ubuntu-latest, windows-latest,macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ matrix.go-version }}

    - name: Test ixgo
      run: go test -race -v .

    - name: Test xgobuild
      run: go test -race -v ./xgobuild

    - name: Test transform
      run: go test -race -v ./transform/...

    - name: Install ixgo
      run: go install -v ./cmd/ixgo

    - name: Test $GOROOT/test
      run: go run ./cmd/ixgotest

    - name: Test iter
      run: ixgo test -v ./cmd/ixgotest/_data/iter

    - name: Test ixgo linkname
      run: go test -race -v -tags linknamefix -ldflags="-checklinkname=0" .

    - name: Test xgobuild linkname
      run: go test -race -v -tags linknamefix -ldflags="-checklinkname=0" ./xgobuild

    - name: Install ixgo linknamefix
      run: go install -tags linknamefix -ldflags="-checklinkname=0" -v ./cmd/ixgo

    - name: Test iter
      run: ixgo test -v ./cmd/ixgotest/_data/iter

    - name: Test pkg patch
      run: go test -v ./test/patch/...

  Test-IfaceFuncval:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        go-tag: [go1.25.14, go1.26.8, go1.27.1]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.27.x'

    - name: Install iface_patch
      run: go install github.com/goplus/reflectx/cmd/iface_patch@v1.8.3

    - name: Clone Go ${{ matrix.go-tag }}
      run: git clone --depth 1 --branch ${{ matrix.go-tag }} https://github.com/golang/go.git "$HOME/${{ matrix.go-tag }}"

    - name: Patch Go
      run: |
        iface_patch "$HOME/${{ matrix.go-tag }}"
        iface_patch -check "$HOME/${{ matrix.go-tag }}"

    - name: Rebuild Go
      run: cd "$HOME/${{ matrix.go-tag }}/src" && ./make.bash

    - name: Test ixgo ifacefuncval
      run: |
        export GOROOT="$HOME/${{ matrix.go-tag }}"
        export PATH="$GOROOT/bin:$PATH"
        go test -v -race -tags goplus.ifacefuncval .
        go test -v -race -tags goplus.ifacefuncval ./xgobuild
        go test -v -race -tags goplus.ifacefuncval ./transform/...
        go install -tags goplus.ifacefuncval -v ./cmd/ixgo
        ixgo test -v ./cmd/ixgotest/_data/iter
